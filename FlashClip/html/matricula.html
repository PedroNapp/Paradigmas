<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script src="../js/moldura.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmar matrícula - FlashClip</title>

    <link rel="stylesheet" href="../css/matricula.css" />
    <link rel="stylesheet" href="../css/experiencia.css?v=2" />
  </head>

  <body>
    
    
    <header class="navbar navbar-matricula">
      <a href="../index.html" class="logo">
        <img src="../imagens/logoFlash.webp" alt="FlashClip" />
      </a>

      <a href="../index.html" class="voltar voltar-evento">
        <span class="voltar-seta" aria-hidden="true">←</span>
        <span>Voltar ao evento</span>
      </a>
    </header>
    
    <main class="pagina-matricula">
      <section class="card-matricula">

        <div class="cabecalho-matricula">
          <span class="categoria-matricula">
            CONFIRMAR MATRÍCULA
          </span>

          <h1>Curso selecionado</h1>

          <p>
            Confira as informações do curso antes de confirmar sua matrícula.
          </p>
        </div>

        
        <div
          id="mensagemMatricula"
          class="mensagem-matricula"
          role="alert"
          aria-live="polite"
          hidden
        ></div>


        <div id="curso" aria-live="polite">
          <p class="estado-carregamento">Carregando curso...</p>
        </div>

        <button
          type="button"
          id="botaoConfirmar"
          class="botao-confirmar"
          disabled
        >
          <span>Confirmar matrícula</span>
          <span class="seta-confirmar" aria-hidden="true">→</span>
        </button>

      </section>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/matricula.js"></script>
    <div class="fc-audio-dock" role="group" aria-label="Controles de áudio"><button type="button" data-audio-music aria-pressed="true">♫ Música ligada</button><button type="button" data-audio-effects aria-pressed="true">♪ Efeitos ligados</button></div>
    <script defer src="../js/experiencia.js?v=2"></script>
    <script defer src="../js/audio-natal.js?v=audio-7"></script>
  </body>
</html>
